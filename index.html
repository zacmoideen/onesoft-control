<style>
:root{--bg:#f2f2f4;--card:#fff;--ink:#141414;--muted:#6b6b72;--line:#e3e3e8;--acc:#1f4e9c;--red:#c62828;--green:#1b7f3b;--amber:#a86b00}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f2f2f2;--muted:#9a9aa2;--line:#2c2c30;--acc:#6ea0ff;--red:#ff6b6b;--green:#4cd27a;--amber:#ffb84d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 16px}
header h1{font-size:22px;margin:0;flex:1}
header small{display:block;font-size:13px;color:var(--muted);font-weight:400}
main{padding:0 16px 40px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.card h3{margin:0 0 10px;font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
button{font:inherit;border:0;border-radius:12px;padding:11px 14px;background:var(--line);color:var(--ink);cursor:pointer}
button.p{background:var(--acc);color:#fff}button.r{background:var(--red);color:#fff}button.g{background:var(--green);color:#fff}
button.link{background:none;color:var(--acc);padding:6px}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 auto}
input,textarea,select{font:inherit;width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.cust{display:flex;align-items:center;gap:12px;cursor:pointer}
.cust .n{font-weight:600}.cust .s{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.ok{background:#e3f4e8;color:var(--green)}.pill.tr{background:#fff3d6;color:var(--amber)}.pill.bad{background:#fde3e3;color:var(--red)}.pill.na{background:var(--line);color:var(--muted)}
@media (prefers-color-scheme:dark){.pill.ok{background:#12301c}.pill.tr{background:#3a2a08}.pill.bad{background:#3a1414}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px}.kv b{color:var(--muted);font-weight:500}
.err{color:var(--red);font-size:14px;min-height:18px;margin-top:8px}
.ok-msg{color:var(--green);font-size:14px;min-height:18px;margin-top:8px}
.pin{display:flex;gap:10px;justify-content:center;margin:24px 0}.pin i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}.pin i.f{background:var(--ink);border-color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:300px;margin:0 auto}.pad button{font-size:26px;padding:16px;background:var(--card)}
.center{text-align:center}.muted{color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%}
.os{display:flex;flex-direction:column;align-items:center;gap:2px;margin:22px 0 8px}.os b{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:#6b7086}.os small{font-size:11px;color:#9a9fb2}
</style>
